<!DOCTYPE html>
<html lang="en">
<body style="margin:0;font-family:'Segoe UI',sans-serif;background:#f9f3e9;color:#262221;padding:24px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:28px;border:1px solid rgba(202,165,94,0.35)">
    <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#caa55e">Verify your email</p>
    <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-weight:500;font-size:26px;color:#741f3f">Hello, {{ name }}</h1>
    <p style="margin:0 0 20px;line-height:1.6;color:#6b625c">Use this one-time code to finish creating your {{ brand }} account:</p>
    <p style="margin:0 0 24px;font-size:32px;letter-spacing:0.35em;font-weight:700;color:#741f3f;text-align:center">{{ otp }}</p>
    <p style="margin:0;font-size:14px;color:#8a827a;line-height:1.5">This code expires in {{ minutes }} minutes. If you did not request registration, you can ignore this email.</p>
  </div>
</body>
</html>
