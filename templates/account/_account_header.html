{% load care_tags %}
<header class="nav auth-nav">
  <div class="wrap nav-bar">
    <a class="brand" href="/">
      {% if site.logo %}<img src="{{ site.logo.url }}" alt="">{% else %}<span class="brand-fallback">VC</span>{% endif %}
    </a>
    <div class="nav-actions">
      <div class="nav-actions__main">
        <a class="btn btn-nav-login" href="{% url 'account' %}">My orders</a>
        <a class="btn btn-line" href="/?open_book=1">Book a service</a>
      </div>
      <form class="nav-logout" method="post" action="{% url 'customer_logout' %}">
        {% csrf_token %}
        <button class="btn-icon-logout" type="submit" aria-label="Log out" title="Log out">{% icon "logout" 20 %}</button>
      </form>
    </div>
  </div>
</header>
